name: Build Fizeau RGB Gains UI

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply RGB gains UI patch
        run: python3 tools/run_robust_rgb_patch.py

      - name: Build inside devkitPro container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            devkitpro/devkita64:latest \
            /bin/bash -lc "git config --global --add safe.directory /workspace && make dist"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fizeau-rgb-gains-ui
          path: out/*
