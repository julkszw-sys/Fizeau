name: Build Fizeau RGB Gains UI

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply RGB gains UI patch
        run: python3 tools/run_robust_rgb_patch.py

      - name: Build inside devkitPro container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            devkitpro/devkita64:latest \
            /bin/bash -lc "git config --global --add safe.directory /workspace && git config --global --add safe.directory /workspace/lib/nvjpg/oss-nvjpg && make all"

      - name: Create SD package
        run: |
          mkdir -p package/config/Fizeau
          mkdir -p package/switch/Fizeau
          mkdir -p package/switch/.overlays
          mkdir -p package/atmosphere/contents/0100000000000F12/flags
          mkdir -p package/atmosphere/exefs_patches/nvnflinger_cmu

          cp misc/default.ini package/config/Fizeau/config.ini
          cp application/out/Fizeau.nro package/switch/Fizeau/Fizeau.nro
          cp overlay/out/Fizeau.ovl package/switch/.overlays/Fizeau.ovl
          cp sysmodule/out/Fizeau.nsp package/atmosphere/contents/0100000000000F12/exefs.nsp
          cp sysmodule/toolbox.json package/atmosphere/contents/0100000000000F12/toolbox.json
          touch package/atmosphere/contents/0100000000000F12/flags/boot2.flag

          cp misc/patches/*.ips package/atmosphere/exefs_patches/nvnflinger_cmu/ 2>/dev/null || true

      - name: Upload SD package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fizeau-rgb-gains-ui-SD-package
          path: package/
